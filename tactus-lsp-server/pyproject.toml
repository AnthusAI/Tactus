[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tactus-lsp-server"
version = "0.1.0"
description = "Language Server Protocol server for Tactus AI workflow language"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Anthus AI" }
]
keywords = ["tactus", "lsp", "language-server", "ai", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tactus>=0.39.0",
    "pygls>=1.3.0,<2",
]

[project.urls]
Homepage = "https://github.com/AnthusAI/Tactus"
Repository = "https://github.com/AnthusAI/Tactus"
Issues = "https://github.com/AnthusAI/Tactus/issues"

[project.scripts]
tactus-lsp-server = "tactus_lsp_server.stdio_server:main"

[tool.hatch.build.targets.wheel]
packages = ["tactus_lsp_server"]
