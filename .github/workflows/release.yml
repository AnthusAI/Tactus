name: Release

on:
  workflow_dispatch:
    inputs:
      auth_probe_only:
        description: "Run only auth dry-run probe against main"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth-probe:
    name: Probe anthusbot push auth (dry run)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.auth_probe_only
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ANTHUSBOT_GH_TOKEN }}
          persist-credentials: true

      - name: Configure git auth and identity
        env:
          ANTHUSBOT_GH_TOKEN: ${{ secrets.ANTHUSBOT_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHUSBOT_GH_TOKEN}" ]; then
            echo "Missing secret: ANTHUSBOT_GH_TOKEN" >&2
            exit 1
          fi
          git config user.name "anthusbot"
          git config user.email "anthusbot@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${ANTHUSBOT_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url --push origin "https://x-access-token:${ANTHUSBOT_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Debug auth context (sanitized)
        env:
          ANTHUSBOT_GH_TOKEN: ${{ secrets.ANTHUSBOT_GH_TOKEN }}
        run: |
          set -euo pipefail
          echo "Actor from token:"
          curl -fsS \
            -H "Authorization: Bearer ${ANTHUSBOT_GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | jq -r '.login, .id, .type'
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Remote origin (sanitized):"
          git remote -v | sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g'
          echo "GitHub extraheader (should be empty):"
          git config --get-all http.https://github.com/.extraheader || true

      - name: Dry-run release-like push to main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git commit --allow-empty -m "chore: release auth probe [skip ci]"
          git push --dry-run origin HEAD:main

  quality-checks:
    name: Quality Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.auth_probe_only
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry install --extras "dev ml"

      - name: Run ruff linting
        run: python -m poetry run ruff check tactus/ tests/ features/steps/

      - name: Run black formatting check
        if: matrix.python-version == '3.12'
        run: python -m poetry run black --check tactus/ tests/ features/steps/

      - name: Run pytest tests
        run: python -m poetry run pytest tests/ -v --tb=short -m "not integration" -n0

      - name: Run behave BDD tests
        run: python -m poetry run behave --tags=-skip

      - name: Run stdlib BDD tests
        run: python -m poetry run tactus stdlib test

  release:
    name: Semantic Release
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: AnthusAI/platform-ci/.github/workflows/semantic-release-reusable.yml@feature/dry-semantic-release
    with:
      python_version: "3.13"
      release_branch: "main"
      install_command: "pip install python-semantic-release"
      run_publish: true
    secrets:
      anthusbot_gh_token: ${{ secrets.ANTHUSBOT_GH_TOKEN }}
      semantic_release_pypi_token: ${{ secrets.PYPI_TOKEN }}

  desktop-builds:
    name: Build Desktop Apps
    runs-on: ${{ matrix.os }}
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Get release version and update package.json
        id: get_version
        run: |
          LATEST_TAG="${{ needs.release.outputs.tag }}"
          VERSION="${{ needs.release.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Found release version: $VERSION"

          # Update package.json version
          cd tactus-desktop
          npm version $VERSION --no-git-tag-version --allow-same-version
        shell: bash

      - name: Install Node dependencies (Desktop)
        working-directory: ./tactus-desktop
        run: npm install

      - name: Build Frontend
        working-directory: ./tactus-desktop
        run: npm run build:frontend

      - name: Build Backend
        working-directory: ./tactus-desktop
        run: npm run build:backend

      - name: Build Electron
        working-directory: ./tactus-desktop
        run: npm run build

      - name: Package Application (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./tactus-desktop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "electron-builder --mac (attempt ${attempt}/3)"
            if npx electron-builder --mac; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Package Application (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./tactus-desktop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "electron-builder --win (attempt ${attempt}/3)"
            if npx electron-builder --win; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Package Application (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./tactus-desktop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "electron-builder --linux (attempt ${attempt}/3)"
            if npx electron-builder --linux; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Upload Desktop Artifacts to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            tactus-desktop/dist-electron/*.dmg
            tactus-desktop/dist-electron/*.exe
            tactus-desktop/dist-electron/*.AppImage

      - name: Remove existing release assets (if any)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.get_version.outputs.tag }}";
            const version = "${{ steps.get_version.outputs.version }}";
            const os = "${{ matrix.os }}";

            const patterns = [];
            if (os === "ubuntu-latest") {
              patterns.push(new RegExp(`^Tactus\\.IDE-${version}-.*\\.AppImage$`));
            } else if (os === "windows-latest") {
              patterns.push(new RegExp(`^Tactus\\.IDE-Setup-${version}\\.exe$`));
            } else if (os === "macos-latest") {
              patterns.push(new RegExp(`^Tactus\\.IDE-${version}-mac\\.dmg$`));
            }

            if (!patterns.length) {
              core.info("No assets configured for this OS.");
              return;
            }

            const { owner, repo } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = release.data.assets || [];

            const matches = assets.filter(asset =>
              patterns.some(pattern => pattern.test(asset.name))
            );

            if (!matches.length) {
              core.info("No matching release assets found to delete.");
              return;
            }

            for (const asset of matches) {
              core.info(`Deleting asset ${asset.name} (${asset.id})`);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

      - name: Attach Desktop Builds to Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: |
            tactus-desktop/dist-electron/*.dmg
            tactus-desktop/dist-electron/*.exe
            tactus-desktop/dist-electron/*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.ANTHUSBOT_GH_TOKEN }}
