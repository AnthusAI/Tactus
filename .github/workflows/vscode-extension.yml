name: VSCode Extension CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-extension:
    name: Test VSCode Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Detect VSCode/LSP changes
      id: changes
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
      with:
        filters: |
          vscode:
            - 'tactus-vscode/**'
            - 'tactus-lsp-server/**'
            - '.github/workflows/vscode-extension.yml'
    
    - name: No relevant changes
      if: steps.changes.outputs.vscode != 'true'
      run: echo "No VSCode extension or LSP changes. Skipping job steps."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      if: steps.changes.outputs.vscode == 'true'
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v5
      if: steps.changes.outputs.vscode == 'true'
      with:
        python-version: '3.11'

    - name: Install Tactus core
      if: steps.changes.outputs.vscode == 'true'
      run: |
        pip install -e .

    - name: Install LSP server
      if: steps.changes.outputs.vscode == 'true'
      run: |
        cd tactus-lsp-server
        pip install -e .

    - name: Test LSP server can start
      if: steps.changes.outputs.vscode == 'true'
      run: |
        timeout 5s python -m tactus_lsp_server.stdio_server || [ $? -eq 124 ]

    - name: Compile VSCode extension
      if: steps.changes.outputs.vscode == 'true'
      run: |
        cd tactus-vscode
        npm run compile

    - name: Package extension
      if: steps.changes.outputs.vscode == 'true'
      run: |
        cd tactus-vscode
        npm run package

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      if: steps.changes.outputs.vscode == 'true'
      with:
        name: tactus-vscode-extension
        path: tactus-vscode/*.vsix
        retention-days: 30

  publish-lsp-server:
    name: Publish LSP Server to PyPI
    runs-on: ubuntu-latest
    needs: test-extension
    permissions:
      contents: read
    # Only attempt publishing from pushes to main. If the PyPI token is missing, we'll no-op.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        pip install build twine

    - name: Build package
      run: |
        cd tactus-lsp-server
        python -m build

    - name: Publish to PyPI (if version changed)
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        cd tactus-lsp-server
        if [ -z "${TWINE_PASSWORD}" ]; then
          echo "PYPI_API_TOKEN not configured for this repo; skipping publish."
          exit 0
        fi
        # Only publish if this version doesn't exist on PyPI
        twine upload --skip-existing dist/*
