name: Docs

on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PAPYRUS_REQUIREMENT: "papyrus-newsroom[markus] @ git+https://github.com/AnthusAI/Papyrus.git@develop"

jobs:
  build:
    if: ${{ vars.DOCS_SITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the Papyrus documentation builder
        run: python -m pip install "$PAPYRUS_REQUIREMENT" "anthus-markus>=0.7.0,<1.0.0"

      - name: Build site
        run: >-
          python -m papyrus_content.markus_renderer.docs_site
          --docs docs --out _site --name "Tactus"
          --tagline "A programming language for AI agent procedures."
          --source-url "https://github.com/AnthusAI/Tactus"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: ${{ vars.DOCS_SITE_ENABLED == 'true' && vars.DOCS_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
