[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tactus"
version = "0.46.2"
description = "Tactus: Lua-based DSL for agentic workflows"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [
    {name = "Anthus", email = "info@anthus.ai"}
]
keywords = ["ai", "agents", "workflows", "lua", "dsl", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "lupa>=2.7",
    "pyyaml",
    "pydantic>=2.0",
    # Use slim package directly to avoid pulling all provider extras transitively.
    "pydantic-ai-slim==1.56.0",
    "griffe<2",
    "logfire>=4.20.0",
    "litellm==1.83.0",
    "aiohttp>=3.13.4",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    # NOTE: We use LiteLLM (via DSPy) for all LLM calls - do not add provider-specific SDKs
    "boto3>=1.28.0",
    "rich>=13.9.4",
    "typer>=0.12,<0.13",
    "python-dotenv>=1.0.0",
    "click>=8.1,<8.2",
    "dotyaml>=0.1.4",
    "antlr4-python3-runtime==4.13.1",
    "behave>=1.2.6",
    "gherkin-official>=28.0.0",
    "rapidfuzz>=3.0.0",
    "nanoid>=2.0.0",
    "nest-asyncio>=1.5.0",
    # File I/O support
    "pyarrow>=14.0",
    "h5py>=3.10",
    "openpyxl>=3.1",
    # DSPy for prompt optimization and LLM abstraction
    "dspy>=3.1.3,<3.2.0; python_version < '3.15'",
    "pypdf>=6.10.2",
    # Biblicus text utilities (requires ReinforcementMemory.max_exemplars support)
    "biblicus>=1.10.0,<2.0.0",
    # Async utils (avoid bad 0.0.0 tarball pulled during CI resolution)
    "sniffio>=1.3.0",
    # IDE server dependencies
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    # Documentation rendering
    "markdown>=3.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.0",
    "behave>=1.2.6",
    "coverage>=7.4",
    # black 26+ requires Python >=3.10; keep 24.x for 3.9 CI compat.
    # CI runs `black --check` only on 3.12 to avoid cross-version diffs.
    "black==26.1.0; python_version >= '3.10'",
    "black==24.10.0; python_version < '3.10'",
    "ruff",
    "python-semantic-release>=9.0.0",
    # Reduce resolver search by pinning transitive CLI deps
    "click-option-group>=0.5.8,<0.6",
    "antlr4-tools>=0.2.1",
    "fastmcp>=3.1.0,<3.2.0; python_version >= '3.10'",
    "pydantic-evals==1.56.0",
    "moto>=5.0",
    "typer>=0.12",
    "mlflow>=2.16",
    # kanbus requires Python >=3.11
    "kanbus>=0.13; python_version >= '3.11'",
]
ml = [
    "scikit-learn>=1.3",
    "datasets>=2.18",
    "joblib>=1.3",
]
hf = [
    "transformers>=4.38",
    "torch>=2.2",
    "datasets>=2.18",
]
# Notification channel optional dependencies
slack = [
    "slack-sdk>=3.0",
]
discord = [
    "discord.py>=2.0",
]
email = [
    "aiosmtplib>=3.0",
]
# Install all notification channels
notifications = [
    "slack-sdk>=3.0",
    "discord.py>=2.0",
    "aiosmtplib>=3.0",
]

[project.scripts]
tactus = "tactus.cli.app:main"

[project.urls]
Homepage = "https://github.com/AnthusAI/Tactus"
Documentation = "https://github.com/AnthusAI/Tactus/tree/main/docs"
Repository = "https://github.com/AnthusAI/Tactus"
Issues = "https://github.com/AnthusAI/Tactus/issues"

[tool.poetry]
packages = [{ include = "tactus" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: Integration tests (may be slower than unit tests)",
    "execution: End-to-end execution tests",
    "bdd: Behavior-driven (Gherkin) tests",
    "examples: Example procedure tests",
    "docker: Requires a running Docker daemon (opt-in; see TACTUS_RUN_DOCKER_TESTS)",
    "xdist_group: pytest-xdist grouping marker",
]
filterwarnings = [
    "ignore:(?s).*DETERMINISM WARNING.*File\\.read\\(\\).*:UserWarning",
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"features/steps/*.py" = ["F811"]  # Allow step_impl redefinition in behave steps
"tactus/validation/generated/*.py" = ["F401", "F403", "F405", "F811", "E711"]  # Ignore ANTLR generated code
"tactus/validation/LuaLexerBase.py" = ["F401", "F403", "F405", "F811"]  # Ignore ANTLR base files
"tactus/validation/LuaParserBase.py" = ["F401", "F403", "F405"]  # Ignore ANTLR base files

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["tactus/__init__.py:__version__"]
branch = "main"
build_command = "pip install build && python -m build"
commit_parser = "angular"
changelog_file = "CHANGELOG.md"
upload_to_vcs_release = true
upload_to_pypi = true
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version}\n\n[skip ci]"
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.remote]
type = "github"
